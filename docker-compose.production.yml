services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: emailplatform
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zP7RFfjm6RHFBSggzUZXuKkk}
      POSTGRES_DB: emailplatform
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-wYGlITDvghKpY4T2}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-U2qFOd9A2FEh3u8uCtCBoOAZ}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  haraka:
    build:
      context: ./infrastructure/haraka
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "25:25"
      - "587:587"
    environment:
      - REDIS_URL=redis://redis:6379
      - WEBHOOK_URL=http://api:3000/webhooks/haraka
      - HARAKA_USER=${HARAKA_USER:-system}
      - HARAKA_PASS=${HARAKA_PASS:-hLuVRZahH82mWdHp}
    depends_on:
      - redis
    volumes:
      - ./infrastructure/haraka/config:/app/haraka/config
      - ./infrastructure/haraka/plugins:/app/haraka/plugins
      - ./infrastructure/haraka/dkim:/app/haraka/dkim
      - ./infrastructure/haraka/tls:/app/haraka/config/tls

volumes:
  postgres_data:
  redis_data:
  minio_data:
