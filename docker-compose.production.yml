services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: emailplatform
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: emailplatform
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    restart: unless-stopped
    env_file: .env
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  haraka:
    build:
      context: ./infrastructure/haraka
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "25:25"
      - "587:587"
    environment:
      # Override: inside Docker, use container names not localhost
      - REDIS_URL=redis://redis:6379
      - WEBHOOK_URL=http://api:3000/webhooks/haraka
    depends_on:
      - redis
    volumes:
      - ./infrastructure/haraka/config:/app/haraka/config
      - ./infrastructure/haraka/plugins:/app/haraka/plugins
      - ./infrastructure/haraka/dkim:/app/haraka/dkim
      - ./infrastructure/haraka/tls:/app/haraka/config/tls

volumes:
  postgres_data:
  redis_data:
  minio_data:
