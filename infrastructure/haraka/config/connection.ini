[main]
strict_rfc1869=false
smtputf8=true

[headers]
add_received=true
show_version=false
clean_auth_results=true
max_received=100
max_lines=1000

[max]
line_length=512
data_line_length=992
bytes=0
mime_parts=1000

[message]
helo=pleased to meet you
close=closing connection. Have a jolly good day.

[uuid]
banner_chars=0
deny_chars=0

[haproxy]
hosts=
